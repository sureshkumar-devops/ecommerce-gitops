# apiVersion: v1
# kind: ServiceAcount
# metadata:
#   name: argocd-repo-server-vault
#   namespace: argocd
# ---
apiVersion: rbac.authorization.k8s.io/v1
kind:  ClusterRole
metadata:
  name: argocd-repo-server-vault
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["serviceaccounts"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-repo-server-vault
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-repo-server-vault
subjects:
- kind: ServiceAccount
  name: argocd-repo-server
  namespace: argocd

