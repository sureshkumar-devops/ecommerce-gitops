apiVersion: v1
kind: ConfigMap
metadata:
  name: argo-rollouts-notification-configmap
  namespace: argo-rollouts
data:
  # 🔹 Slack service config
  service.slack: |
    token: $slack-token

  # 🔹 Templates
  template.analysis-failed: |
    message: |
      ❌ *Analysis Failed*
      Rollout: {{.rollout.metadata.name}}
      Namespace: {{.rollout.metadata.namespace}}

  template.rollout-aborted: |
    message: |
      ⚠️ *Rollout Aborted*
      Rollout: {{.rollout.metadata.name}}

  template.rollout-success: |
    message: |
      ✅ *Rollout Successful*
      Rollout: {{.rollout.metadata.name}}

  # 🔹 Triggers
  trigger.on-analysis-failed: |
    - when: analysis.status.phase in ['Error','Failed']
      send: [analysis-failed]

  trigger.on-rollout-aborted: |
    - when: rollout.status.abort == true
      send: [rollout-aborted]

  trigger.on-rollout-success: |
    - when: rollout.status.phase == 'Healthy'
      send: [rollout-success]
