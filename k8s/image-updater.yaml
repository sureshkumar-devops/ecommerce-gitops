apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: ecommerce-image-updater
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: helm
    app.kubernetes.io/part-of: ecommerce
    environment: gitops
spec:
  # This namespace field tells the updater where to look for the Applications
  namespace: argocd
  
  #writeBackConfig:
  #  method: "git:secret:argocd/git-creds"
  #  gitConfig:
  #    repository: "https://github.com/sureshkumar-devops/ecommerce-gitops.git"
     # --- GLOBAL CONFIG (Used by all environments) ---
  config:
    git.commit.user: "argocd-image-updater"
    git.commit.email: "argocd-image-updater@user.noreply@argoproj.io"
    git.commit-message-template: |
      chore(image): update {{ .AppName }} 

      {{ range .AppChanges -}}
      Environment: {{ $.AppName }}
      Image: {{ .Image.Name }}
      Previous Tag: {{ .OldTag }}
      New Tag: {{ .NewTag }}
      {{ end -}}

  applicationRefs:  
    #------------ DEVELOPMENT --------------------
    - namePattern: "dev-my-app"
      images:
        - alias: "app-dev"
          imageName: "lehardocker/ecommerce-app"
          commonUpdateSettings:
            updateStrategy: "newest-build"
            allowTags: "regexp:^dev-.*"
          manifestTargets:
            helm:
              name: "image.repository"
              tag: "image.tag"
      writeBackConfig:
        method: "git:secret:argocd/git-creds"
        gitConfig:
          repository: "https://github.com/sureshkumar-devops/ecommerce-gitops.git"
          branch: "dev"
          writeBackTarget: "environments/dev/values.yaml"          

   # --- STAGING ---
    - namePattern: "staging-my-app"
      images:
        - alias: "app-stag"
          imageName: "lehardocker/ecommerce-app"
          commonUpdateSettings:
            updateStrategy: "newest-build"
            allowTags: "regexp:^stag-.*"
          manifestTargets:
            helm:
              name: "image.repository"
              tag: "image.tag"
      writeBackConfig:
        method: "git:secret:argocd/git-creds"
        gitConfig:
          repository: "https://github.com/sureshkumar-devops/ecommerce-gitops.git"
          branch: "staging"
          writeBackTarget: "environments/staging/values.yaml"

    # --- PRODUCTION ---
    - namePattern: "prod-my-app"
      images:
        - alias: "app-prod"
          imageName: "lehardocker/ecommerce-app"
          commonUpdateSettings:
            updateStrategy: "newest-build"
            allowTags: "regexp:^v[0-9]+\\.[0-9]+\\.[0-9]+-.*"
          manifestTargets:
            helm:
              name: "image.repository"
              tag: "image.tag"
      writeBackConfig:
        method: "git:secret:argocd/git-creds"
        gitConfig:
          repository: "https://github.com/sureshkumar-devops/ecommerce-gitops.git"
          branch: "master"
          writeBackTarget: "environments/prod/values.yaml"

