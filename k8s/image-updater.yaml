apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: ecommerce-image-updater  
  namespace: argocd
spec:
  namespace: argocd

  writeBackConfig:
    method: "git:secret:argocd/git-creds"

  applicationRefs:
    - namePattern: "*-my-app"      
      images:
          - alias: "app"
            imageName: "lehardocker/ecommerce-app"
            commonUpdateSettings:
                updateStrategy: newest-build
                allowTags: regexp:^dev-.*
                pullSecret: "pullsecret:argocd/dockerhub-creds"  

