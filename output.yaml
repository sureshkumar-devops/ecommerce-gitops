# Source: my-app/templates/service.yaml
# 1. THE MAIN / ACTIVE SERVICE
# Always created for every environment (Dev, Staging, Prod)
apiVersion: v1
kind: Service
metadata:
  name: prod-svc-my-app-active  # Matches 'stableService' or 'activeService'
  namespace: prod
  labels:
    app.kubernetes.io/name: my-app
    environment: prod
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: my-app
    app.kubernetes.io/instance: prod-my-app

---

# 2. THE PREVIEW / CANARY SERVICE
# Only created if we are NOT doing a simple "deployment"
apiVersion: v1
kind: Service
metadata:
  name: prod-svc-my-app-preview # Matches 'canaryService' or 'previewService'
  namespace: prod
  labels:
    app.kubernetes.io/name: my-app
    environment: prod
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: my-app
    app.kubernetes.io/instance: prod-my-app


