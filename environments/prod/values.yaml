# --- Global Environment Identifier ---

env: prod
gitopsBranch: master
# --- Deployment / Rollout Settings ---
replicaCount: 3
deploymentStrategy: bluegreen
image:
  repository: lehardocker/ecommerce-app
  tag: "v2026.04.01-34f3964"
  pullPolicy: Always
# --- Service Configuration ---
service:
  enabled: true
  name: prod-my-app-svc-active
  previewName: prod-my-app-svc-preview # Add this line
  port: 80
  targetPort: 3000 # matches app inside container
# --- Container & Probe Settings ---   
containerPort: 3000 # matches app inside container
# Fixed: Added empty resources block to prevent "null" error in template
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
# --- Probe Settings ---

# Provide defaults to prevent template rendering errors
probePath: /
readinessProbe:
  initialDelaySeconds: 5
  timeoutSeconds: 2
  periodSeconds: 10
  failureThreshold: 3
livenessProbe:
  initialDelaySeconds: 15
  timeoutSeconds: 2
  periodSeconds: 10
  failureThreshold: 3
# --- Analysis Metrics NGF (Nginx Gateway Fabrics) Level ---

analysis:
  enabled: true
  interval: 30s
  count: 5
  traffic:
    min: 20
  error:
    threshold: 0.01 # 1% max
    consecutiveLimit: 2
  success:
    threshold: 0.99
  latency:
    threshold: 0.3 # 300ms
  prometheus:
    #address: http://prometheus-operated.monitoring.svc.cluster.local:9090
    address: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
# --- Gateway API Configuration --
httpRoute:
  enabled: true
  parentGatewayName: shared-gateway
  parentGatewayNamespace: nginx-gateway
  parentGatewaySectionName: http-prod
  hostnames:
  - prod.admedia.com
features:
  RetryAnalysis: true
  ExperimentTrafficRouting: true
# --- ServiceMonitor in prod for stable, service‑based scraping ---
monitoring:
  enabled: true
  type: servicemonitor
  prometheusRelease: monitoring
  portName: metrics
  interval: 30s
  path: /metrics
rollout:
  enabled: true
