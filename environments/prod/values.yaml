# --- Global Environment Identifier ---
env: prod
gitopsBranch: master
# --- Deployment / Rollout Settings ---
replicaCount: 3
deploymentStrategy: bluegreen
image:
  repository: lehardocker/ecommerce-app
  tag: "v2026.03.26-87e6873"
  pullPolicy: Always
# --- Service Configuration ---
service:
  name: prod-svc-my-app-active
  previewName: prod-svc-my-app-preview # Add this line
  port: 80
  targetPort: 3000 # matches app inside container
# --- Container & Probe Settings ---   
containerPort: 3000 # matches app inside container
# Fixed: Added empty resources block to prevent "null" error in template
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
# --- Probe Settings ---
# Provide defaults to prevent template rendering errors
probePath: /
readinessProbe:
  initialDelaySeconds: 5
  timeoutSeconds: 2
  periodSeconds: 10
  failureThreshold: 3
livenessProbe:
  initialDelaySeconds: 15
  timeoutSeconds: 2
  periodSeconds: 10
  failureThreshold: 3
httpRoute:
  enabled: true
  parentGatewayName: shared-gateway
  parentGatewayNamespace: nginx-gateway
  parentGatewaySectionName: http-prod
  hostnames:
  - prod.admedia.com
