replicaCount: 3
deploymentStrategy: bluegreen
image:
  repository: lehardocker/ecommerce-app
  pullPolicy: Always
  tag: "v2026.03.20-32b66e9" # Image Updater will replace this with dev-<sha>
service:
  port: 80 # external service port
  targetPort: 3000 # matches app inside container
containerPort: 3000 # matches app inside container
probePath: /
# Provide defaults for the probes
readinessProbe:
  initialDelaySeconds: 5
livenessProbe:
  initialDelaySeconds: 15
