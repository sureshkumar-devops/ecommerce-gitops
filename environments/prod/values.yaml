# Source: my-app/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name:  staging-svc-my-app
  namespace: staging
  labels:
    app.kubernetes.io/managed-by: helm
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/name: my-app
    environment: staging
    gitops.branch:
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: my-app
    app.kubernetes.io/instance: release-name
---
# Source: my-app/templates/gateway.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: staging-gateway
  namespace: staging
  labels:
    app.kubernetes.io/managed-by: helm
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/name: staging-gateway
    environment: staging
    gitops.branch:
spec:
  gatewayClassName: nginx
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    hostname: "staging.admedia.com"
    allowedRoutes:
      namespaces:
        from: Same
---
# Source: my-app/templates/httproute.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  # Generates: dev-svc-gapi-my-app, prod-svc-gapi-my-app, etc.
  name: staging-httproute-my-app
  namespace: staging
  labels:
    app.kubernetes.io/managed-by: helm
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/name: my-app
    environment: staging
    gitops.branch:
spec:
  parentRefs:
    - name: staging-gateway
      # Useful if the gateway is in a different namespace
  hostnames:
    - "staging.admedia.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: staging-svc-my-app
          port: 80
