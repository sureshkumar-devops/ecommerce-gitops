# --- Global Environment Identifier ---
env: dev
gitopsBranch: dev
# --- Deployment / Rollout Settings ---
replicaCount: 1
deploymentStrategy: deployment
image:
  repository: lehardocker/ecommerce-app
  tag: "dev-23056f3" # Image Updater will replace this with dev-<sha>
  pullPolicy: Always
# --- Service Configuration ---  
service:
  enabled: true
  name: dev-my-app-svc-active
  previewName: dev-my-app-svc-preview
  port: 80 # external service port
  targetPort: 3000 # matches app inside container
# --- Container & Resource Settings ---
containerPort: 3000 # matches app inside container
# Fixed: Added empty resources block to prevent "null" error in template
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
# --- Probe Settings ---
# Provide defaults to prevent template rendering errors
probePath: /
readinessProbe:
  initialDelaySeconds: 5
  timeoutSeconds: 2
  periodSeconds: 10
  failureThreshold: 3
livenessProbe:
  initialDelaySeconds: 15
  timeoutSeconds: 2
  periodSeconds: 10
  failureThreshold: 3

analysis:
  enabled: true
  interval: 30s
  count: 2 # Reduced from 3 to 2 for faster Dev cycles
  # thresholds

  errorRateThreshold: 0.2        # <5% errors
  successRateThreshold: 0.7      # >95% success
  latencyThreshold: 1.5           # <500ms

  #successThreshold: 0.05 # Slightly more relaxed (10%) for unstable dev traffic
  #failureThreshold: 0.05 # Slightly more relaxed
  #retryOnError: true
  prometheus:
    # Double check this internal URL exists in your Dev cluster!
    #address: http://prometheus-operated.monitoring.svc.cluster.local:9090
    address: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
    #job: my-app-dev # Usually dev jobs have a -dev suffix
httpRoute:
  enabled: false
  parentGatewayName: shared-gateway
  parentGatewayNamespace: nginx-gateway
  parentGatewaySectionName: http-dev
  hostnames:
  - dev.admedia.com
features:
  RetryAnalysis: true
  ExperimentTrafficRouting: true
# --- ServiceMonitor in prod for stable, service‑based scraping ---
monitoring:
  enabled: false
  type: servicemonitor
  prometheusRelease: prometheus
  portName: metrics
  interval: 30s
  path: /metrics
rollout:
  enabled: false # no Rollout, just Deployment
