# --- Global Environment Identifier ---
env: dev
gitopsBranch: dev
# --- Deployment / Rollout Settings ---
replicaCount: 1
deploymentStrategy: deployment
image:
  repository: lehardocker/ecommerce-app
  tag: "dev-4f69607" # Image Updater will replace this with dev-<sha>
  pullPolicy: Always
# --- Service Configuration ---  
service:
  name: dev-svc-my-app
  port: 80 # external service port
  targetPort: 3000 # matches app inside container
# --- Container & Resource Settings ---
containerPort: 3000 # matches app inside container
# Fixed: Added empty resources block to prevent "null" error in template
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
# --- Probe Settings ---
# Provide defaults to prevent template rendering errors
probePath: /
readinessProbe:
  initialDelaySeconds: 5
  timeoutSeconds: 2
  periodSeconds: 10
  failureThreshold: 3
livenessProbe:
  initialDelaySeconds: 15
  timeoutSeconds: 2
  periodSeconds: 10
  failureThreshold: 3
# --- Gateway API Configuration ---
gateway:
  enabled: true
  className: nginx # Matches your GatewayClass name
httpRoute:
  enabled: true
  parentGatewayName: dev-gateway
  hostnames:
  - dev.admedia.com
