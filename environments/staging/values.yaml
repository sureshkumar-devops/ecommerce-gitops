# --- Global Environment Identifier ---

env: staging
gitopsBranch: staging
# --- Deployment / Rollout Settings ---
replicaCount: 2
deploymentStrategy: canary
image:
  repository: lehardocker/ecommerce-app
  tag: "stag-3c12982"
  pullPolicy: Always
# --- Service Configuration ---  
service:
  enabled: true
  name: staging-my-app-svc-active # stable service
  previewName: staging-my-app-svc-preview # canary/new service
  port: 80
  targetPort: 3000
# --- Container & Resource Settings ---
containerPort: 3000
# Fixed: Added empty resources block to prevent "null" error in template

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
# --- Probe Settings ---
# Provide defaults to prevent template rendering errors
probePath: /
readinessProbe:
  initialDelaySeconds: 5
  timeoutSeconds: 2
  periodSeconds: 10
  failureThreshold: 3
livenessProbe:
  initialDelaySeconds: 15
  timeoutSeconds: 2
  periodSeconds: 10
  failureThreshold: 3
# --- Analysis Metrics Application Level ---
analysis:
  enabled: true
  interval: 30s
  count: 3
  traffic:
    min: 10
  error:
    threshold: 0.02
    consecutiveLimit: 2
  success:
    threshold: 0.98
  latency:
    Threshold: 0.5
  prometheus:
    #address: http://prometheus-operated.monitoring.svc.cluster.local:9090
    address: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
    #job: my-app-staging
# --- Gateway API Configuration --
httpRoute:
  enabled: true
  parentGatewayName: shared-gateway
  parentGatewayNamespace: nginx-gateway
  parentGatewaySectionName: http-staging
  hostnames:
  - staging.admedia.com
features:
  RetryAnalysis: true
  ExperimentTrafficRouting: true
# --- PodMonitor in staging to learn direct pod scraping. ---
monitoring:
  enabled: true
  type: podmonitor
  prometheusRelease: monitoring
  portName: metrics
  interval: 30s
  path: /metrics
rollout:
  enabled: true
