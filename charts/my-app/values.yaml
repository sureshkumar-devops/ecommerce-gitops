replicaCount: 1

image:
  repository: lehardocker/ecommerce-app
  pullPolicy: IfNotPresent
  tag: "dev-c3e5504"  # leave empty, environment files will override

deploymentStrategy: deployment
# options:
# deployment
# canary
# bluegreen  


serviceAccount:
  create: false

service:
  type: ClusterIP
  port: 80
  targetPort: 3000  

ingress:
  enabled: false

autoscaling:
  enabled: false

gitCredentials:
  name: git-creds
  url: "https://github.com/sureshkumar-devops/ecommerce-gitops.git"
  username: sureshkumar-devops
  password: "" # passing the sensitive tokens via --set terminal/CI environment

imageCredentials:
  name: dockerhub-creds
  username: lehardocker
  password: ""  # passing the sensitive tokens via --set terminal/CI environment
  auth: ""  # passing the sensitive tokens via --set terminal/CI environment

