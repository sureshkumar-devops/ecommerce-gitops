# --- Global Environment Identifier ---

env: ""

replicaCount: 1   # Canary needs at least 2 to show the split (e.g., 1 old, 1 new)
deploymentStrategy: deployment
image:
  repository: lehardocker/ecommerce-app
  pullPolicy: IfNotPresent
  tag: "dev-c3e5504"
# FIXED: Changed from /health to / to stop the CrashLoop

# Container Configuration
    
probePath: / 
containerPort: 3000

# ADDED: These objects are required by your rollout.yaml template

readinessProbe:
  initialDelaySeconds: 5
  timeoutSeconds: 2
  periodSeconds: 10
  failureThreshold: 3

livenessProbe:
  initialDelaySeconds: 15
  timeoutSeconds: 2
  periodSeconds: 10
  failureThreshold: 3

# --- Service Configuration ---
    
service:
  enabled: true
  name: dev-my-app-svc-active # Ensure this matches your HTTPRoute backendRef
  previewName: dev-my-app-svc-preview
  type: ClusterIP
  port: 80
  targetPort: 3000

serviceAccount:
  create: false

# --- Gateway API Configuration ---

gatewayClass:
  create: true  # Set to false if the class 'nginx' already exists in the cluster

gateway:
  enabled: true
  className: nginx

analysis:
  enabled: true        # default off, override per env
  name: app-health-check

  # Common timing (balanced)
  interval: 30s
  count: 3

  # 🔹 Traffic Gate (prevents false success)
  traffic:
    min: 10

  # 🔹 Error Rate (2% allowed)
  error:
    threshold: 0.02
    consecutiveLimit: 2

  # 🔹 Success Rate (>= 98%)
  success:
    threshold: 0.98

  # 🔹 Latency P95 (500ms)
  latency:
    threshold: 0.5
  

  prometheus:
    #address: http://prometheus-operated.monitoring.svc.cluster.local:9090
    address: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
    job: my-app




httpRoute:
  enabled: true
  parentGatewayName: dev-gateway
  hostnames:
    - dev.admedia.com

ingress:
  enabled: false
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
  hosts:
   - host: dev.admedia.com  # Placeholder to be overridden
     paths:
     - path: /
       pathType: Prefix
       backend: 
         service:
           name: dev-my-app
           port:
               number: 80
  tls:  # or Configure TLS if you want HTTPS
   - hosts:
        - dev.admedia.com
     secretName: dev-admedia-tls     

        
rollout:
  enabled: true

hpa:
  enabled: false  # Default to off
  minReplicas: 2
  maxReplicas: 5
