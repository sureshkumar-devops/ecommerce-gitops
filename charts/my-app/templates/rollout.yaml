{{- if eq .Values.deploymentStrategy "canary" }}
# Canary Rollout for staging

apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "my-app.fullname" . }}
spec:
 replicas: {{ .Values.replicaCount }}
 strategy:
  canary:  
    stableService: {{ include "my-app.fullname" . }}
    steps:
    - setWeight: 20
    - pause: { duration: 60s }
    - setWeight: 50
    - pause: { duration: 60s }  
    - setWeight: 100
 selector:
   matchLabels:
     app: my-app
 template:
  metadata:
    labels:
      app: my-app
  spec:
    containers:
    - name: {{ .Chart.Name }}
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}" # <-- promoted tag from Dev
      imagePullPolicy: {{ .Values.image.pullPolicy }}  
      ports:
        - containerPort: 80
      readinessProbe:
        httpGet:
          path: /health
          port: 8080
        initialDelaySeconds: 10
        periodSeconds: 5
      livenessProbe:
        httpGet:
          path: /health
          port: 8080
        initialDelaySeconds: 20
        periodSeconds: 10   
{{- end }}        

