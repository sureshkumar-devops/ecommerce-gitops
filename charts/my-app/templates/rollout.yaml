{{- if eq .Values.deploymentStrategy "canary" }}
# Canary Rollout for staging

apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "my-app.fullname" . }}
spec:
 replicas: {{ .Values.replicaCount }}
 strategy:
  canary:  
    steps:
    - setWeight: 20
    - pause: { duration: 30s }
    - setWeight: 50
    - pause: { duration: 30s }
    - setWeigth: 100
 selector:
   matchLabels:
     app: my-app
 template:
  metadata:
    labels:
      app: my-app
  spec:
    containers:
    - name: {{ .Chart.Name }}
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
      imagePullPolicy: {{ .Values.image.pullPolicy }}  
{{- end }}        

