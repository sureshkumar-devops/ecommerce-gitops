{{- if ne .Values.deploymentStrategy "deployment" }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "my-app.fullname" . }}
  namespace: {{ .Values.env }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    environment: {{ .Values.env }}
spec:
  replicas: {{ .Values.replicaCount | default 2 }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "my-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "my-app.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "Always" }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort | default 3000 }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probePath | default "/" }}
              port: {{ .Values.containerPort | default 3000 }}
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: {{ .Values.probePath | default "/" }}
              port: {{ .Values.containerPort | default 3000 }}
            initialDelaySeconds: 20

  strategy:
    {{- if eq .Values.deploymentStrategy "canary" }}
    canary:
      canaryService: {{ .Values.service.previewName }}
      stableService: {{ .Values.service.name }}
      trafficRouting:
        gatewayAPI:
          httpRoute: {{ .Values.env }}-httproute-my-app
      steps:
        - setWeight: 20
        {{- if .Values.analysis.enabled }}
        - analysis:
            templates:
            - templateName: {{ .Values.env }}-error-rate-check
              args:
              - name: metricName
                value: error-rate-canary
              - name: jobName
                value: {{ include "my-app.jobName" . | quote }}
        {{- end }}
        - pause: { duration: 30s }
        - setWeight: 50
        - pause: { duration: 30s }
    {{- end }}

    {{- if eq .Values.deploymentStrategy "bluegreen" }}
    blueGreen:
      activeService: {{ .Values.service.name }}
      previewService: {{ .Values.service.previewName }}
      autoPromotionEnabled: false
      {{- if .Values.analysis.enabled }}
      prePromotionAnalysis:
        templates:
        - templateName: {{ .Values.env }}-error-rate-check
        args:
        - name: metricName
          value: error-rate-pre
        - name: jobName
          value: {{ include "my-app.jobName" . | quote }}
      postPromotionAnalysis:
        templates:
        - templateName: {{ .Values.env }}-error-rate-check
        args:
        - name: metricName
          value: error-rate-post
        - name: jobName
          value: {{ include "my-app.jobName" . | quote }}
      {{- end }}
    {{- end }}
{{- end }}
