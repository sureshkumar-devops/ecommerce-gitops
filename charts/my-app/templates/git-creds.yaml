{{- $git := .Values.gitCredentials | default dict -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $git.name | default "git-creds" }}
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  url: {{ $git.url | quote }}
  username: {{ $git.username | quote }}
  password: {{ $git.password | quote }}
