{{- if .Values.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "my-app.fullname" . }}-hpa
  namespace: {{ .Values.env }}
  labels:
    {{- include "my-app.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: {{ if or (eq .Values.deploymentStrategy "canary") (eq .Values.deploymentStrategy "bluegreen") }}argoproj.io/v1alpha1{{ else }}apps/v1{{ end }}
    kind: {{ if or (eq .Values.deploymentStrategy "canary") (eq .Values.deploymentStrategy "bluegreen") }}Rollout{{ else }}Deployment{{ end }}
    name: {{ include "my-app.fullname" . }}    
  minReplicas: {{ .Values.hpa.minReplicas }}
  maxReplicas: {{ .Values.hpa.maxReplicas }}
  metrics:
    {{- if .Values.hpa.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.hpa.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.hpa.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.hpa.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
