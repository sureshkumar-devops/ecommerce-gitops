{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  # Generates: dev-svc-gapi-my-app, prod-svc-gapi-my-app, etc.
  name: {{ .Values.env }}-svc-gapi-my-app  
  namespace: {{ .Values.env }}  
  labels:
    {{- include "my-app.labels" . | nindent 4 }}    
spec:
  parentRefs:
    - name: {{ .Values.httpRoute.parentGatewayName }}
      # Useful if the gateway is in a different namespace
      {{- if .Values.httpRoute.parentGatewayNamespace }}
      namespace: {{ .Values.httpRoute.parentGatewayNamespace }}
      {{- end }}      
      {{- if .Values.httpRoute.parentGatewaySectionName }}
      sectionName: {{ .Values.httpRoute.parentGatewaySectionName }}
      {{- end }}
  hostnames:
    {{- range .Values.httpRoute.hostnames }}
    - {{ . | quote }}    
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Values.service.name }}
          port: {{ .Values.service.port }}
{{- end }}
