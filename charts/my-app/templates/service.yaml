# 1. THE MAIN / ACTIVE SERVICE (Always created)
{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "my-app.serviceNameActive" . }}
  namespace: {{ .Values.env }}
  labels:
    {{- include "my-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: {{ .Values.monitoring.portName | default "metrics" }}
  selector:
    {{- include "my-app.selectorLabels" . | nindent 4 }}
{{- end }}

---

# 2. THE PREVIEW / CANARY SERVICE (Staging/Prod only)
{{- if and .Values.service.enabled (or (eq .Values.env "staging") (eq .Values.env "prod")) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "my-app.serviceNamePreview" . }}
  namespace: {{ .Values.env }}
  labels:
    {{- include "my-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: {{ .Values.monitoring.portName | default "metrics" }}
  selector:
    {{- include "my-app.selectorLabels" . | nindent 4 }}
{{- end }}

