# 1. THE MAIN / ACTIVE SERVICE (Always created)
{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "my-app.serviceNameActive" . }}
  namespace: {{ .Values.env }}
  labels:
    {{- include "my-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: {{ .Values.monitoring.portName | default "metrics" }}
  selector:
    {{- include "my-app.selectorLabels" . | nindent 4 }}
{{- end }}

---

# 2. THE SECONDARY SERVICE (Canary for Staging / Preview for Prod)
{{- if and .Values.service.enabled (or (eq .Values.deploymentStrategy "canary") (eq .Values.deploymentStrategy "bluegreen")) }}
apiVersion: v1
kind: Service
metadata:
  # Logic to switch naming based on strategy
  name: {{ if eq .Values.deploymentStrategy "canary" }}{{ include "my-app.serviceNameCanary" . }}{{ else }}{{ include "my-app.serviceNamePreview" . }}{{ end }}
  namespace: {{ .Values.env }}
  labels:
    {{- include "my-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: {{ .Values.monitoring.portName | default "metrics" }}
  selector:
    {{- include "my-app.selectorLabels" . | nindent 4 }}
{{- end }}


