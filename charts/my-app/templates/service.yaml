# 1. THE MAIN / ACTIVE SERVICE
# Always created for every environment (Dev, Staging, Prod)
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name }}  # Matches 'stableService' or 'activeService'
  namespace: {{ .Values.env }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    environment: {{ .Values.env }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "my-app.selectorLabels" . | nindent 4 }}

---

# 2. THE PREVIEW / CANARY SERVICE
# Only created if we are NOT doing a simple "deployment"
{{- if ne .Values.deploymentStrategy "deployment" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.previewName }} # Matches 'canaryService' or 'previewService'
  namespace: {{ .Values.env }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    environment: {{ .Values.env }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "my-app.selectorLabels" . | nindent 4 }}
{{- end }}

