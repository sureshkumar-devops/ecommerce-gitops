{{- if eq .Values.deploymentStrategy "bluegreen" }}
# Blue Green Rollout for production
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "my-app.fullname" . }}
  namespace: {{ .Values.env }}
  labels:
    app.kubernetes.io/managed-by: helm
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/name: {{ .Chart.Name }}
    environment: {{ .Values.env }}
    gitops.branch: {{ .Values.gitopsBranch }}
spec:
  replicas: {{ .Values.replicaCount | default 3 }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:      
      app.kubernetes.io/name: {{ .Chart.Name }}      
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}  # ADD THIS LINE
    spec:
      containers:
        - name: my-app-c3
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http-bluegreen
              containerPort: {{ .Values.containerPort }}
          # FIX: Probes added to prevent the 404 crash loop during the Green phase
          readinessProbe:
            httpGet:
              path: {{ .Values.probePath | default "/" }}
              port: {{ .Values.containerPort }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds | default 10 }}
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ .Values.probePath | default "/" }}
              port: {{ .Values.containerPort }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds | default 20 }}
            periodSeconds: 10
  strategy:
    blueGreen:
      # These services must exist in your service.yaml
      #activeService: {{ include "my-app.fullname" . }}-active
      activeService: {{ .Values.env }}-svc-my-app-active  
      #previewService: {{ include "my-app.fullname" . }}-preview
      previewService: {{ .Values.env }}-svc-my-app-preview
      # Manual promotion: You must run 'kubectl argo rollouts promote' to switch traffic
      autoPromotionEnabled: false
        {{- end }}
