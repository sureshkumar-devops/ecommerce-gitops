{{- if (default false .Values.analysis.enabled) }}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ .Values.env }}-app-health-check
  namespace: {{ .Values.env }}
spec:
  args:
    - name: jobName

  metrics:

  # 🔹 Traffic Gate
  - name: traffic-volume
    interval: {{ .Values.analysis.interval }}
    count: {{ .Values.analysis.count }}
    successCondition: result > {{ .Values.analysis.traffic.min }}
    failureCondition: result <= {{ .Values.analysis.traffic.min }}
    provider:
      prometheus:
        address: {{ .Values.analysis.prometheus.address }}
        query: |
          sum(rate(http_requests_total{job="{{`{{args.jobName}}`}}"}[1m]))


  # ----------------------------------
  # ✅ ERROR RATE (5xx errors) # 🔹 Error Rate
  # ----------------------------------
  - name: error-rate
    interval: {{ .Values.analysis.interval }}
    count: {{ .Values.analysis.count }}
    successCondition: result < {{ .Values.analysis.error.threshold }}
    failureCondition: result >= {{ .Values.analysis.error.threshold }}
    consecutiveErrorLimit: {{ .Values.analysis.error.consecutiveLimit }}
    provider:
      prometheus:
        address: {{ .Values.analysis.prometheus.address }}
        query: |
          scalar(
            sum(rate(http_requests_total{status=~"5..", job="{{`{{args.jobName}}`}}"}[1m])) 
            /
            sum(rate(http_requests_total{job="{{`{{args.service-name}}`}}"}[1m]))
          )
          

  # ----------------------------------
  # ✅ SUCCESS RATE - # 🔹 Success Rate
  # ----------------------------------
  - name: success-rate
    interval: {{ .Values.analysis.interval }}
    count: {{ .Values.analysis.count }}
    successCondition: result > {{ .Values.analysis.success.threshold }}
    failureCondition: result <= {{ .Values.analysis.success.threshold }}    
    provider:
      prometheus:
        address: {{ .Values.analysis.prometheus.address }}
        query: |
          scalar(
            sum(rate(http_requests_total{status!~"5..", job="{{`{{args.jobName}}`}}"}[1m]))
            /
            sum(rate(http_requests_total{job="{{`{{args.jobName}}`}}"}[1m]))
          )
          
  # ----------------------------------
  # ✅ LATENCY (P95) -  # 🔹 Latency
  # ----------------------------------
  - name: latency-p95
    interval: {{ .Values.analysis.interval }}
    count: {{ .Values.analysis.count }}
    successCondition: result < {{ .Values.analysis.latency.threshold }}
    failureCondition: result >= {{ .Values.analysis.latency.threshold }}
    provider:
      prometheus:
        address: {{ .Values.analysis.prometheus.address }}
        query: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket{job="{{`{{args.jobName}}`}}"}[1m])) by (le))         
{{- end }}
