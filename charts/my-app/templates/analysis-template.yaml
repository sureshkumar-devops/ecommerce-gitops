{{- if (default false .Values.analysis.enabled) }}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ .Values.env }}-app-health-check
  namespace: {{ .Values.env }}
spec:
  args:
    - name: jobName
  metrics:
  # 🔹 Traffic Gate (Passes if > threshold OR exactly 0)
  - name: traffic-volume
    interval: {{ .Values.analysis.interval }}
    count: {{ .Values.analysis.count }}
    successCondition: result > {{ .Values.analysis.traffic.min }} || result == 0
    failureCondition: result <= {{ .Values.analysis.traffic.min }} && result != 0
    provider:
      prometheus:
        address: {{ .Values.analysis.prometheus.address }}
        query: |
          scalar(sum(rate(http_requests_total{job="{{`{{args.jobName}}`}}"}[1m])) or vector(0))

  # 🔹 Error Rate (Passes if < threshold OR exactly 0)
  - name: error-rate
    interval: {{ .Values.analysis.interval }}
    count: {{ .Values.analysis.count }}
    # FIXED: Added missing "||" operator
    successCondition: result < {{ .Values.analysis.error.threshold }} || result == 0
    failureCondition: result >= {{ .Values.analysis.error.threshold }}
    consecutiveErrorLimit: {{ .Values.analysis.error.consecutiveLimit }}
    provider:
      prometheus:
        address: {{ .Values.analysis.prometheus.address }}
        query: |
          scalar(
            (sum(rate(http_requests_total{status=~"5..",job="{{`{{args.jobName}}`}}"}[1m])) or vector(0))
            /
            (sum(rate(http_requests_total{job="{{`{{args.jobName}}`}}"}[1m])) or vector(1))
          )

  # 🔹 Success Rate (Passes if > threshold OR exactly 0)
  - name: success-rate
    interval: {{ .Values.analysis.interval }}
    count: {{ .Values.analysis.count }}
    successCondition: result > {{ .Values.analysis.success.threshold }} || result == 0
    failureCondition: result <= {{ .Values.analysis.success.threshold }} && result != 0
    provider:
      prometheus:
        address: {{ .Values.analysis.prometheus.address }}
        query: |
          scalar(
            (sum(rate(http_requests_total{status!~"5..", job="{{`{{args.jobName}}`}}"}[1m])) or vector(0))
            /
            (sum(rate(http_requests_total{job="{{`{{args.jobName}}`}}"}[1m])) or vector(1))
          )

  # 🔹 Latency (Passes if < threshold OR exactly 0)
  - name: latency-p95
    interval: {{ .Values.analysis.interval }}
    count: {{ .Values.analysis.count }}
    successCondition: result < {{ .Values.analysis.latency.threshold }} || result == 0
    failureCondition: result >= {{ .Values.analysis.latency.threshold }}
    provider:
      prometheus:
        address: {{ .Values.analysis.prometheus.address }}
        query: |
          scalar(
            histogram_quantile(0.95,
              sum(rate(http_request_duration_seconds_bucket{job="{{`{{args.jobName}}`}}"}[1m])) by (le)
            ) or vector(0)
          )
{{- end }}

