apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ .Values.env }}-error-rate-check
  namespace: {{ .Values.env }}
spec:
  args:
  - name: jobName
  metrics:
  - name: error-rate-check
    interval: {{ .Values.analysis.interval }}
    count: {{ .Values.analysis.count }}
    successCondition: "result < {{ .Values.analysis.successThreshold }}"
    failureCondition: "result >= {{ .Values.analysis.failureThreshold }}"
    consecutiveErrorLimit: 4 
    provider:
      prometheus:
        address: {{ .Values.analysis.prometheus.address }}
        query: |
          {{- if eq .Values.env "staging" }}
          # Staging: filter by job label
          # Staging: Handle no traffic with vector(0) and vector(1)
          (
            sum(rate(http_requests_total{job="{{`{{args.jobName}}`}}",status=~"5.."}[1m]))
            or vector(0)
          )
          /
          (
            sum(rate(http_requests_total{job="{{`{{args.jobName}}`}}"}[1m]))
            or vector(1)
          )
          {{- else if eq .Values.env "prod" }}
          # Prod: filter by ingress label
          # Prod: Handle no traffic with vector(0) and vector(1)
          (
            sum(rate(nginx_http_requests_total{host="{{`{{args.jobName}}`}}",status=~"5.."}[1m]))
            or vector(0)
          )
          /
          (
            sum(rate(nginx_http_requests_total{host="{{`{{args.jobName}}`}}"}[1m])))
            or vector(1)
          )
          {{- end }}
