{{- if and (eq .Values.env "dev") .Values.analysis.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisRun
metadata:
  # generateName works here because of the 'Sync' hook annotation below
  generateName: dev-health-check-run-
  namespace: {{ .Values.env }}
  annotations:
    # Forces Argo CD to use 'kubectl create' instead of 'apply'
    argocd.argoproj.io/hook: Sync
    # Ensures old failed/successful runs are cleaned up before a new one starts
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  # Corrected: Use 'templates' as a list to pull metrics from your AnalysisTemplate
  templates:
    - templateName: {{ .Values.env }}-app-health-check
  arguments:
    - name: jobName
      value: {{ .Values.jobName | default "my-app" | quote }}
{{- end }}

