{{- if and (eq .Values.env "dev") .Values.analysis.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisRun
metadata:
  # Using generateName requires a Hook annotation for Argo CD to work
  generateName: dev-health-check-run-
  namespace: {{ .Values.env }}
  annotations:
    # This tells Argo CD to use 'create' instead of 'apply'
    argocd.argoproj.io/hook: Sync 
    # Optional: Automatically delete the old run before starting a new one
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation 
spec:
  analysisTemplate:
    name: {{ .Values.env }}-app-health-check
  arguments:
    - name: jobName
      value: {{ .Values.jobName | default "my-app" | quote }}
{{- end }}

