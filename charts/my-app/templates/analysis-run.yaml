{{- if and (eq .Values.env "dev") .Values.analysis.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisRun
metadata:
  # Using generateName + Sync Hook ensures Argo CD can create new runs reliably
  generateName: dev-health-check-run-
  namespace: {{ .Values.env }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  args:
  - name: jobName
    value: {{ .Values.jobName | default "my-app" | quote }}

  metrics:
  # 🔹 Traffic Gate
  - name: traffic-volume
    interval: 15s
    count: 2
    successCondition: result > 5
    failureCondition: result <= 5
    provider:
      prometheus:
        address: http://cluster.local
        query: |
          sum(rate(http_requests_total{job="{{ `{{` }}args.jobName{{ `}}` }}"}[1m]))
  
  # 🔹 Error Rate
  - name: error-rate
    interval: 15s
    count: 2
    successCondition: result < 0.05
    failureCondition: result >= 0.05
    consecutiveErrorLimit: 3
    provider:
      prometheus:
        address: http://cluster.local
        query: |
          scalar(
            (sum(rate(http_requests_total{status=~"5..",job="{{ `{{` }}args.jobName{{ `}}` }}"}[1m])) or vector(0))
            /
            (sum(rate(http_requests_total{job="{{ `{{` }}args.jobName{{ `}}` }}"}[1m])) or vector(1))
          )

  # 🔹 Success Rate
  - name: success-rate
    interval: 15s
    count: 2
    successCondition: result > 0.95
    failureCondition: result <= 0.95
    provider:
      prometheus:
        address: http://cluster.local
        query: |
          scalar(
            (sum(rate(http_requests_total{status!~"5..", job="{{ `{{` }}args.jobName{{ `}}` }}"}[1m])) or vector(0))
            /
            (sum(rate(http_requests_total{job="{{ `{{` }}args.jobName{{ `}}` }}"}[1m])) or vector(1))
          )

  # 🔹 Latency
  - name: latency-p95
    interval: 15s
    count: 2
    successCondition: result < 0.5
    failureCondition: result >= 0.5
    provider:
      prometheus:
        address: http://cluster.local
        query: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket{job="{{ `{{` }}args.jobName{{ `}}` }}"}[1m])) by (le))
{{- end }}

