{{- if and (eq .Values.env "dev") .Values.analysis.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisRun
metadata:
  # Using generateName ensures every sync creates a unique run
  generateName: {{ .Values.env }}-health-check-run-
  namespace: {{ .Values.env }}
  annotations:
    # Sync hook tells Argo CD to 'create' instead of 'apply'
    argocd.argoproj.io/hook: Sync
    # Cleans up the previous run before starting the new one
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  # This links directly to the AnalysisTemplate you provided
  templates:
    - templateName: {{ .Values.env }}-app-health-check
  arguments:
    - name: jobName
      value: {{ .Values.jobName | default "my-app" | quote }}
{{- end }}

