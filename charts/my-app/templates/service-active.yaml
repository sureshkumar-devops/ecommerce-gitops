{{- if eq .Values.deploymentStrategy "bluegreen" }}
apiVersion: v1
kind: Service
metadata:
 # Matches 'activeService' in rollout-bluegreen.yaml
  name: {{ .Values.env }}-svc-{{ .Chart.Name }}-active
  namespace: {{ .Values.env }}  
  labels:
    app.kubernetes.io/managed-by: helm
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/name: {{ .Chart.Name }}
    environment: {{ .Values.env }}
    gitops.branch: {{ .Values.gitopsBranch }}
spec:
  selector:  
    {{- include "my-app.selectorLabels" . | nindent 4 }}  
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.service.port | default 80 }}
      targetPort: {{ .Values.containerPort | default 3000 }}
      protocol: TCP
      name: http
{{- end }}
