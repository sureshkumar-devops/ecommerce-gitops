name: Sync Dev → Staging → Master
on:
  workflow_call:
    inputs:
      branch:
        description: "Branch to sync (dev, staging, prod)"
        required: true
        type: string
      commitMessage:        
        description: "Commit message format"
        required: false
        type: string
        default: "[ImageUpdater] Updated image for ${{ inputs.branch }}"
    secrets:   
      GITOPS_TOKEN:
        description: "Token for pushing changes to GitOps repo"
        required: true

jobs:
  sync-gitops-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Gitops Repo        
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITOPS_TOKEN }}
          repository: sureshkumar-devops/ecommerce-gitops
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Sync Branches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@user.noreply.github.com"

          git fetch origin

          # Map target branches to their specific environment folders
          # staging -> environments/staging
          # master  -> environments/prod
          declare -A ENV_MAP=( ["staging"]="staging" ["master"]="prod" )

          for BRANCH in "${!ENV_MAP[@]}" ; do
            TARGET_FOLDER="environments/${ENV_MAP[$BRANCH]}"
            echo "🔄 Syncing $BRANCH with dev (Protecting $TARGET_FOLDER)"

            # 1. Reset target branch to match remote exactly
            git checkout $BRANCH
            git reset --hard origin/$BRANCH

            # 2. Pull EVERYTHING from dev into the current branch
            git checkout origin/dev -- .

            # 3. RESTORE the environment-specific folder from the original branch state
            # This puts the correct values.yaml (with the right image tags) back
            git checkout HEAD -- "$TARGET_FOLDER"

            # 4. Commit and Push
            git add .
            if ! git diff --cached --quiet; then
              git commit -m "🚀 Sync: Update from dev to $BRANCH (Kept $TARGET_FOLDER)"
              git push origin $BRANCH
              echo "✅ $BRANCH updated."
            else
              echo "ℹ️ $BRANCH already up-to-date."
            fi
          done

          #TARGETS=("staging" "master")

          #for BRANCH in "${TARGETS[@]}" ; do
